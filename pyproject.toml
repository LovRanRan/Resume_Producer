[project]
name = "resume-producer"
version = "0.1.0"
description = "按 JD 定制简历生成器：master markdown 档案 → AI 筛选改写 → 固定 LaTeX 模板 → PDF"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "jinja2>=3.1.6",
    "anthropic>=0.122.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
resume = "resume_producer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_producer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
